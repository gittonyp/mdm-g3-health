<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remote Care Clinic</title><link rel="stylesheet" href="/static/clinic.css"><script src="/static/clinic.js"></script></head><body><main class="clinic-shell"><nav id="nav" class="clinic-nav"></nav><section id="system-banner"></section><header><h1>Remote Care Clinic</h1><p class="muted">Who needs attention today?</p></header><section id="counts" class="clinic-card"></section><section class="clinic-card clinic-grid"><label>Program<select id="program"><option value="">All programs</option><option>hospice</option><option>telehealth</option></select></label><label>Status<select id="status"><option value="">All</option><option value="action">Needs action</option><option value="overdue">Overdue</option></select></label><button class="btn" id="add">Add patient</button></section><section id="error" class="error"></section><section id="worklist"></section></main><dialog id="patient-dialog"><form method="dialog" id="patient-form"><h2>Add patient</h2><label>Name<input name="display_name" required></label><label>DOB<input name="dob" type="date" required></label><label>Program<select name="program"><option>hospice</option><option>telehealth</option></select></label><label>Device ID<input name="device_id" required></label><label>Caregiver<input name="caregiver_name"></label><p><button class="btn btn-ghost" value="cancel">Cancel</button> <button class="btn" value="default">Create</button></p></form></dialog><script>
ClinicUI.renderNav('clinic');const out=document.querySelector('#worklist'),err=document.querySelector('#error');let rows=[];function render(){const program=document.querySelector('#program').value,status=document.querySelector('#status').value;const filtered=rows.filter(p=>(!program||p.program===program)&&(!status||(status==='action'&&['emergency','actionable','quality'].includes(p.tier))||(status==='overdue'&&p.overdue)));out.innerHTML=filtered.map(p=>`<article class="clinic-card patient-card ${ClinicUI.tierClass(p.tier)}" tabindex="0" onclick="location='/clinic/patient/${p.patient_id}'" onkeydown="if(event.key==='Enter')location='/clinic/patient/${p.patient_id}'"><h2>${ClinicUI.esc(p.display_name)} <small>${p.patient_id}</small></h2><div>${p.program} · <b>${p.tier}</b> · ${ClinicUI.esc(p.status)}</div><p>${ClinicUI.esc(p.what_changed)}<br><span class="muted">${ClinicUI.esc(p.data_quality)} · ${ClinicUI.esc(p.next_action)}</span></p></article>`).join('')||'<div class="clinic-card">No patients need review.</div>'}async function load(){try{const d=await ClinicUI.api('/api/clinic/worklist');rows=d.patients;document.querySelector('#counts').textContent=`${d.counts.patients} patients · ${d.counts.need_action} need action · ${d.counts.overdue} overdue · last sync ${ClinicUI.fmtDateTime(d.generated_at)}`;document.querySelector('#system-banner').innerHTML=d.broker_connected?'':'<div class="clinic-banner">Live data unavailable - clinical status is Unknown</div>';render()}catch(e){err.textContent=e.message}}ClinicUI.poll(load,10000);document.querySelector('#program').onchange=render;document.querySelector('#status').onchange=render;document.querySelector('#add').onclick=()=>ClinicUI.openDialog('patient-dialog');document.querySelector('#patient-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await ClinicUI.api('/api/patients',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});e.target.closest('dialog').close();e.target.reset();load()}catch(x){err.textContent=x.message}};</script></body></html>
