<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server history · Patient vitals</title>
<link rel="icon" href="data:,">
<style>
:root{
  --ink:#16233f; --muted:#5d6b85; --paper:#eef1f6; --panel:#fff; --line:#d7dde8;
  --ok:#0e8f83; --warn:#c98a12; --bad:#d6453d;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
a{color:#1b5fd6;text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:11px;background:#16233f;display:grid;place-items:center;flex:none}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav a{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--ink)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#b5bdcc}
.dot.on{background:var(--ok)}
.dot.bad{background:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px rgba(16,30,54,.04)}
.toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:10px;margin-bottom:14px}
label{font-size:12px;font-weight:650;color:var(--muted);display:grid;gap:5px}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:210px}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 13px;cursor:pointer}
button:hover{background:#f7f9fc}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
h2{font-size:14px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:0 8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #edf0f5;vertical-align:top}
tr:last-child td{border-bottom:0}
.num{text-align:right;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:16px 4px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.badge.alert{background:#fde8e7;color:#a92720}
.badge.watch{background:#fdf3dd;color:#8a5c06}
.badge.normal{background:#e5f5f2;color:#08766b}
.badge.offline{background:#eef1f6;color:#5d6b85}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.muted{color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:16px}
@media (max-width:900px){.grid,.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>
      </div>
      <div>
        <h1>Server history</h1>
        <div class="sub">Persisted MQTT readings and anomaly log</div>
      </div>
    </div>
    <nav class="nav">
      <a href="/">Live monitor</a>
      <a href="/api/export.csv">Download CSV</a>
      <a href="/docs" target="_blank" rel="noopener">API docs</a>
    </nav>
  </header>

  <div class="pills">
    <div class="pill"><i class="dot" id="dApi"></i><span id="tApi">API</span></div>
    <div class="pill"><i class="dot" id="dMqtt"></i><span id="tMqtt">MQTT</span></div>
    <div class="pill"><span id="tBroker">Broker</span></div>
    <div class="pill"><span id="tDevices">0 devices</span></div>
    <div class="pill"><span id="tMessages">0 messages</span></div>
  </div>

  <div class="toolbar">
    <label>Device
      <select id="device"><option value="">All devices</option></select>
    </label>
    <button id="refresh">Refresh</button>
    <span class="muted" id="lastRefresh"></span>
  </div>

  <section class="card">
    <h2>Devices</h2>
    <div id="devices"></div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>Recent anomalies</h2>
      <div id="anomalies"></div>
    </section>
    <section class="card">
      <h2>Recent vitals</h2>
      <div id="vitals"></div>
    </section>
  </div>

  <div class="foot">
    <span>Data is stored in SQLite on the server.</span>
    <span id="statusLine">Loading…</span>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let selected = "";

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function fmt(value, digits = 0) {
  if (value === null || value === undefined || Number.isNaN(Number(value))) return "--";
  return Number(value).toFixed(digits);
}

function when(value) {
  if (!value) return "--";
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? esc(value) : date.toLocaleString();
}

async function fetchJson(path) {
  const response = await fetch(path, {cache: "no-store"});
  if (!response.ok) throw new Error(`${path} returned ${response.status}`);
  return response.json();
}

function statusBadge(status) {
  const value = String(status || "offline").toLowerCase();
  const cls = value === "online" ? "normal" : "offline";
  return `<span class="badge ${cls}">${esc(value)}</span>`;
}

function levelBadge(level) {
  const value = String(level || "normal").toLowerCase();
  const cls = value === "alert" ? "alert" : value === "watch" ? "watch" : "normal";
  return `<span class="badge ${cls}">${esc(value)}</span>`;
}

function renderDevices(devices) {
  if (!devices.length) {
    $("devices").innerHTML = '<div class="empty">No devices have published yet.</div>';
    return;
  }
  const rows = devices.map(d => `
    <tr>
      <td class="mono">${esc(d.device_id)}</td>
      <td>${statusBadge(d.status)}</td>
      <td>${when(d.last_seen)}</td>
      <td class="num">${fmt(d.last_hr)}</td>
      <td class="num">${fmt(d.last_spo2)}</td>
      <td class="num">${fmt(d.last_temp, 1)}</td>
      <td>${esc(d.last_activity || "--")}</td>
      <td>${esc(d.last_state || "--")}</td>
    </tr>`).join("");
  $("devices").innerHTML = `
    <div style="overflow:auto">
      <table>
        <thead><tr><th>Device</th><th>Status</th><th>Last seen</th><th class="num">HR</th><th class="num">SpO2</th><th class="num">Temp</th><th>Activity</th><th>State</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderAnomalies(anomalies) {
  if (!anomalies.length) {
    $("anomalies").innerHTML = '<div class="empty">No anomalies recorded.</div>';
    return;
  }
  const rows = anomalies.map(a => `
    <tr>
      <td>${when(a.ts)}</td>
      <td class="mono">${esc(a.device_id)}</td>
      <td>${levelBadge(a.level)}</td>
      <td class="num">${fmt(a.score, 2)}</td>
      <td>${esc(a.reason)}</td>
    </tr>`).join("");
  $("anomalies").innerHTML = `
    <div style="overflow:auto">
      <table>
        <thead><tr><th>Time</th><th>Device</th><th>Level</th><th class="num">Score</th><th>Reason</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderVitals(vitals) {
  if (!vitals.length) {
    $("vitals").innerHTML = '<div class="empty">No vital readings recorded.</div>';
    return;
  }
  const rows = vitals.map(v => `
    <tr>
      <td>${when(v.ts)}</td>
      <td class="mono">${esc(v.device_id)}</td>
      <td class="num">${fmt(v.hr)}</td>
      <td class="num">${fmt(v.spo2)}</td>
      <td class="num">${fmt(v.hrv)}</td>
      <td class="num">${fmt(v.temp, 1)}</td>
      <td>${esc(v.state || "--")}</td>
    </tr>`).join("");
  $("vitals").innerHTML = `
    <div style="overflow:auto">
      <table>
        <thead><tr><th>Time</th><th>Device</th><th class="num">HR</th><th class="num">SpO2</th><th class="num">HRV</th><th class="num">Temp</th><th>State</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderDeviceSelect(devices) {
  const select = $("device");
  const current = selected;
  select.innerHTML = '<option value="">All devices</option>' + devices
    .map(d => `<option value="${esc(d.device_id)}">${esc(d.device_id)}</option>`)
    .join("");
  select.value = devices.some(d => d.device_id === current) ? current : "";
  selected = select.value;
}

async function refresh() {
  try {
    const filter = selected ? `&device_id=${encodeURIComponent(selected)}` : "";
    const [health, stats, devices, anomalies, vitals] = await Promise.all([
      fetchJson("/api/health"),
      fetchJson("/api/stats"),
      fetchJson("/api/devices"),
      fetchJson(`/api/anomalies?limit=20${filter}`),
      fetchJson(`/api/vitals?limit=40${filter}`)
    ]);

    $("dApi").className = "dot on";
    $("tApi").textContent = "API online";
    $("dMqtt").className = "dot " + (health.mqtt_connected ? "on" : "bad");
    $("tMqtt").textContent = health.mqtt_connected ? "MQTT connected" : "MQTT offline";
    $("tBroker").textContent = health.broker;
    $("tDevices").textContent = `${stats.devices} device${stats.devices === 1 ? "" : "s"}`;
    $("tMessages").textContent = `${stats.messages} messages`;
    $("lastRefresh").textContent = "Updated " + new Date().toLocaleTimeString();
    $("statusLine").textContent = `Root ${health.root} · ${stats.vitals} vitals · ${stats.anomalies} anomalies`;

    renderDeviceSelect(devices);
    renderDevices(devices);
    renderAnomalies(anomalies);
    renderVitals(vitals);
  } catch (error) {
    $("dApi").className = "dot bad";
    $("tApi").textContent = "API offline";
    $("statusLine").textContent = error.message;
  }
}

$("device").addEventListener("change", event => {
  selected = event.target.value;
  refresh();
});
$("refresh").addEventListener("click", refresh);
setInterval(refresh, 3000);
refresh();
</script>
</body>
</html>
