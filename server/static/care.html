<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caregiver tasks - Remote Care</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/clinic.css">
<script src="/static/nav.js"></script>
<script src="/static/clinic.js"></script>
</head>
<body>
<div class="wrap">
  <nav id="nav"></nav>
  <div class="page-head">
    <h1 id="title">Caregiver tasks</h1>
    <p class="sub" id="subtitle"></p>
  </div>
  <p id="error" class="error" role="alert"></p>
  <section id="tasks" aria-live="polite"><div class="skeleton"></div></section>
</div>

<script>
ClinicUI.setActor('caregiver');
ClinicUI.renderNav('care');
const E = ClinicUI.esc, $ = s => document.querySelector(s);
const id = new URLSearchParams(location.search).get('patient');
const root = $('#tasks');
const HEADLINE = { emergency: 'Urgent - check now', actionable: 'Please check', quality: 'Sensor problem', watch: 'Keep an eye on this', stable: 'All clear', unknown: 'No data' };
const ANSWER = { done: 'Done', cannot: 'Could not do it', contact_doctor: 'Asked for the doctor' };

async function picker() {
  $('#subtitle').textContent = 'Choose who you are caring for.';
  const ps = await ClinicUI.api('/api/patients');
  root.innerHTML = ps.length
    ? '<div class="picker">' + ps.map(p => '<a class="card btn-lg" style="display:block;text-decoration:none;color:inherit;margin:0" href="/care?patient=' + encodeURIComponent(p.id) + '"><b>' + E(p.display_name) + '</b><div class="muted">' + E(p.id) + '</div></a>').join('') + '</div>'
    : '<div class="card empty">No patients yet.</div>';
}

async function tasks() {
  const d = await ClinicUI.api('/api/care/tasks?patient_id=' + encodeURIComponent(id));
  const p = d.patient;
  $('#title').textContent = 'Tasks for ' + p.display_name;
  $('#subtitle').innerHTML = '<a href="/care">Switch patient</a>';
  const banner = p.caregiver_available ? '' : '<div class="banner">No caregiver is assigned, so the doctor owns these tasks.</div>';
  root.innerHTML = banner + (d.tasks.map(t => {
    const answered = t.caregiver_response ? '<div class="responded">You answered: ' + E(ANSWER[t.caregiver_response] || t.caregiver_response) + '</div>' : '';
    const mine = t.owner === 'caregiver';
    const buttons = mine
      ? '<div class="buttons"><button class="btn btn-primary btn-lg" data-r="done" data-id="' + t.id + '">Done</button>' +
        '<button class="btn btn-lg" data-r="cannot" data-id="' + t.id + '">I can\u2019t do this</button>' +
        '<button class="btn btn-lg" data-r="contact_doctor" data-id="' + t.id + '">Call the doctor</button></div>'
      : '<div class="responded" style="color:var(--muted)">The doctor is handling this. Nothing for you to do.</div>';
    return '<article class="card task stripe ' + ClinicUI.tierClass(t.tier) + '"><div class="row between"><h2>' + E(HEADLINE[t.tier] || t.tier) + '</h2>' +
      '<span class="muted">' + E(ClinicUI.fmtAge(t.age_s)) + '</span></div>' +
      '<p class="instruction">' + E(t.instruction) + '</p><p class="muted">Why: ' + E(t.reason) + '</p>' + answered + buttons + '</article>';
  }).join('') || '<div class="card empty">Nothing needs doing right now. \u2714</div>');
}

async function load() {
  try { $('#error').textContent = ''; await (id ? tasks() : picker()); }
  catch (e) { $('#error').textContent = e.message; root.innerHTML = ''; }
}

root.addEventListener('click', async e => {
  const b = e.target.closest('button[data-r]'); if (!b) return;
  b.disabled = true;
  try {
    await ClinicUI.api('/api/alerts/' + b.dataset.id + '/caregiver-response', { method: 'POST', body: JSON.stringify({ response: b.dataset.r }) });
    ClinicUI.toast('Sent. Thank you.');
  } catch (x) { ClinicUI.toast(x.message, true); }
  load();
});

ClinicUI.poll(load, 5000);
</script>
</body>
</html>
