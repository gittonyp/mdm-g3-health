<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caregiver tasks</title><link rel="stylesheet" href="/static/clinic.css"><script src="/static/clinic.js"></script></head><body><main class="clinic-shell"><nav id="nav" class="clinic-nav"></nav><h1>Caregiver tasks</h1><section id="tasks"></section></main><script>
ClinicUI.setActor('caregiver');ClinicUI.renderNav('care');const q=new URLSearchParams(location.search),id=q.get('patient');const root=document.querySelector('#tasks');async function load(){if(!id){const ps=await ClinicUI.api('/api/patients');root.innerHTML='<div class="clinic-card"><label>Patient<select id="picker">'+ps.map(p=>`<option value="${p.id}">${ClinicUI.esc(p.display_name)} (${p.id})</option>`).join('')+'</select></label></div>';const picker=document.querySelector('#picker');picker.onchange=()=>location.search='patient='+picker.value;return}try{const d=await ClinicUI.api('/api/care/tasks?patient_id='+encodeURIComponent(id));root.innerHTML=(d.patient.caregiver_available?'':'<div class="clinic-banner">No caregiver assigned - doctor owns these tasks.</div>')+d.tasks.map(t=>`<article class="clinic-card ${ClinicUI.tierClass(t.tier)}"><h2>${ClinicUI.esc(t.tier)}</h2><p>${ClinicUI.esc(t.instruction)}</p><button class="btn" onclick="respond(${t.id},'done')">Done</button> <button class="btn btn-ghost" onclick="respond(${t.id},'cannot')">Cannot do</button> <button class="btn btn-ghost" onclick="respond(${t.id},'contact_doctor')">Contact doctor</button></article>`).join('')||'<div class="clinic-card">No tasks.</div>'}catch(e){root.innerHTML='<p class="error">'+ClinicUI.esc(e.message)+'</p>'}}async function respond(i,r){await ClinicUI.api('/api/alerts/'+i+'/caregiver-response',{method:'POST',body:JSON.stringify({response:r})});load()}ClinicUI.poll(load,5000);</script></body></html>
