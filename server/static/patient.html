<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient</title><link rel="stylesheet" href="/static/clinic.css"><script src="/static/clinic.js"></script></head><body><main class="clinic-shell"><nav id="nav" class="clinic-nav"></nav><section id="content"></section></main><script>
ClinicUI.renderNav('clinic');const id=location.pathname.split('/').pop(),root=document.querySelector('#content');async function load(){try{const d=await ClinicUI.api('/api/patients/'+encodeURIComponent(id));const p=d.patient,v=d.latest_vital||{};root.innerHTML=`<a href="/clinic">← Worklist</a><header class="clinic-card"><h1>${ClinicUI.esc(p.display_name)} <small>${p.id}</small></h1><p>${p.program} · DOB ${p.dob} · Device ${d.device?d.device.device_id:'Unknown'}</p></header><section class="clinic-grid">${[['Heart rate','hr','bpm'],['SpO2','spo2','%'],['Temperature','temp','C']].map(x=>`<div class="clinic-card"><div class="muted">${x[0]}</div><h2>${ClinicUI.fmtValue(v[x[1]],x[1]==='temp'?1:0)} ${x[2]}</h2></div>`).join('')}</section><section class="clinic-card"><h2>Open alerts</h2>${d.open_alerts.map(a=>`<article class="${ClinicUI.tierClass(a.tier)}"><b>${a.tier}</b> — ${ClinicUI.esc(a.reason)}<p>${ClinicUI.esc(a.display_status)} · ${ClinicUI.esc(a.next_action)}</p><button class="btn" onclick="ack(${a.id})">Acknowledge</button> <button class="btn btn-danger" onclick="resolveAlert(${a.id})">Resolve</button></article>`).join('')||'<p>No open alerts.</p>'}</section><section class="clinic-card"><h2>Notes</h2>${d.notes.map(n=>`<p><b>${n.kind}</b> ${ClinicUI.esc(n.text)}</p>`).join('')||'<p>No notes.</p>'}</section>`}catch(e){root.innerHTML=`<p class="error">${ClinicUI.esc(e.message)}</p>`}}async function ack(i){await ClinicUI.api('/api/alerts/'+i+'/ack',{method:'POST'});load()}async function resolveAlert(i){const note=prompt('Resolution note');if(note)await ClinicUI.api('/api/alerts/'+i+'/resolve',{method:'POST',body:JSON.stringify({note})});load()}load();</script></body></html>
